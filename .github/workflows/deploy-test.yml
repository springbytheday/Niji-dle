name: Test Cache-Busting (no deploy)

# Safe to run on any branch. Does NOT deploy to GitHub Pages —
# it only runs the same sed rewrite + safety check as deploy.yml
# and lets you inspect the result before it ever goes live.
on:
  push:
    branches-ignore: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Inject cache-busting version on script tags
        run: |
          SHA="${{ steps.vars.outputs.sha }}"
          echo "Using version token: $SHA"

          FILES=("index.html" "updates/index.html")

          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::warning::$FILE not found — skipping."
              continue
            fi

            BEFORE_COUNT=$(grep -oE 'src="/js/[a-zA-Z0-9_-]+\.js(\?v=[a-zA-Z0-9]+)?"' "$FILE" | wc -l)

            sed -i -E "s|(src=\"/js/[a-zA-Z0-9_-]+\.js)(\?v=[a-zA-Z0-9]+)?\"|\1?v=${SHA}\"|g" "$FILE"

            echo "---- $FILE: resulting script tags ----"
            grep 'src="/js/' "$FILE" || echo "(none found)"

            AFTER_COUNT=$(grep -oE 'src="/js/[a-zA-Z0-9_-]+\.js\?v='"${SHA}"'"' "$FILE" | wc -l)
            echo "$FILE: versioned tags found: $AFTER_COUNT (expected: $BEFORE_COUNT)"
            if [ "$AFTER_COUNT" -ne "$BEFORE_COUNT" ]; then
              echo "::error::$FILE — expected $BEFORE_COUNT versioned /js/ script tags but found $AFTER_COUNT. Check for renamed/reformatted script tags."
              exit 1
            fi
          done

          echo "✅ Regex and safety check passed on all files — safe to merge into dev."

      - name: Upload rewritten HTML files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: rewritten-html-files
          path: |
            index.html
            updates/index.html
