name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Inject cache-busting version on script tags
        run: |
          SHA="${{ steps.vars.outputs.sha }}"
          echo "Using version token: $SHA"

          # List every HTML file that loads /js/*.js scripts and needs
          # cache-busting. Add more paths here if you create additional
          # pages that load local scripts.
          FILES=("index.html" "updates/index.html")

          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::warning::$FILE not found — skipping."
              continue
            fi

            # Count how many /js/*.js script tags exist BEFORE rewriting,
            # so the safety check below is self-derived per file rather
            # than a hardcoded number that can drift out of date.
            BEFORE_COUNT=$(grep -oE 'src="/js/[a-zA-Z0-9_-]+\.js(\?v=[a-zA-Z0-9]+)?"' "$FILE" | wc -l)

            # Matches src="/js/whatever.js" or src="/js/whatever.js?v=OLDTOKEN"
            # and rewrites it to src="/js/whatever.js?v=SHA"
            sed -i -E "s|(src=\"/js/[a-zA-Z0-9_-]+\.js)(\?v=[a-zA-Z0-9]+)?\"|\1?v=${SHA}\"|g" "$FILE"

            echo "---- $FILE: resulting script tags ----"
            grep 'src="/js/' "$FILE" || echo "(none found)"

            # Safety check: fail the build if the number of successfully
            # versioned tags doesn't match how many were there beforehand,
            # so a silent regex miss (renamed path, changed quoting, new
            # subfolder, etc.) is caught here instead of shipping a
            # mismatched-version bug to players.
            AFTER_COUNT=$(grep -oE 'src="/js/[a-zA-Z0-9_-]+\.js\?v='"${SHA}"'"' "$FILE" | wc -l)
            echo "$FILE: versioned tags found: $AFTER_COUNT (expected: $BEFORE_COUNT)"
            if [ "$AFTER_COUNT" -ne "$BEFORE_COUNT" ]; then
              echo "::error::$FILE — expected $BEFORE_COUNT versioned /js/ script tags but found $AFTER_COUNT. Check for renamed/reformatted script tags."
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Extra guard: even if this workflow is ever manually triggered from
    # another branch, only an actual dev-branch run is allowed to deploy.
    if: github.ref == 'refs/heads/dev'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
