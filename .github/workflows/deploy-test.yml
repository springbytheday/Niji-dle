name: Test Cache-Busting (no deploy)

# Safe to run on any branch. Does NOT deploy to GitHub Pages —
# it only runs the same sed rewrite + safety check as deploy.yml
# and lets you inspect the result before it ever goes live.
on:
  push:
    branches-ignore: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Inject cache-busting version on script tags
        run: |
          SHA="${{ steps.vars.outputs.sha }}"
          echo "Using version token: $SHA"

          EXPECTED_COUNT=6

          sed -i -E "s|(src=\"/js/[a-zA-Z0-9_-]+\.js)(\?v=[a-zA-Z0-9]+)?\"|\1?v=${SHA}\"|g" index.html

          echo "---- Resulting script tags ----"
          grep 'src="/js/' index.html

          ACTUAL_COUNT=$(grep -oE 'src="/js/[a-zA-Z0-9_-]+\.js\?v='"${SHA}"'"' index.html | wc -l)
          echo "Versioned script tags found: $ACTUAL_COUNT (expected: $EXPECTED_COUNT)"
          if [ "$ACTUAL_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "::error::Expected $EXPECTED_COUNT versioned /js/ script tags but found $ACTUAL_COUNT. Check index.html for renamed/reformatted script tags, or update EXPECTED_COUNT if you intentionally added/removed one."
            exit 1
          fi

          echo "✅ Regex and safety check passed — safe to merge into dev."

      - name: Upload rewritten index.html for inspection
        uses: actions/upload-artifact@v4
        with:
          name: rewritten-index-html
          path: index.html
